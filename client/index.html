<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Nostalgia</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <main class="home-container">

        <header class="hero">
            <h1>PROJECT NOSTALGIA</h1>
            <p>Childhood games. Online again.</p>
        </header>


        <section class="menu">

            <button class="menu-card" id="gameNameButton">
                <span class="icon">🎮</span>

                <span class="card-content">
                    <strong>GAME NAME</strong>
                    <small>Choose your player name</small>
                </span>

                <span class="arrow">→</span>
            </button>


            <button class="menu-card" id="createRoomButton">
                <span class="icon">🏠</span>

                <span class="card-content">
                    <strong>CREATE ROOM</strong>
                    <small>Start a new game</small>
                </span>

                <span class="arrow">→</span>
            </button>


            <button class="menu-card" id="joinRoomButton">
                <span class="icon">🔗</span>

                <span class="card-content">
                    <strong>JOIN ROOM</strong>
                    <small>Enter a friend's room</small>
                </span>

                <span class="arrow">→</span>
            </button>

        </section>


        <footer>
            <p>Project Nostalgia © 2026</p>
        </footer>

    </main>


    <script src="/socket.io/socket.io.js"></script>
<script src="index.js"></script>

</body>

</html>
